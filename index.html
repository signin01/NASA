<!DOCTYPE html>
<html lang="en" data-theme="cosmos">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="COSMOS ULTRA - Deep Space Intelligence Platform powered by NASA and public space APIs." />
  <meta name="theme-color" content="#00000a" />
  <title>COSMOS ULTRA | Deep Space Intelligence Platform</title>
  <link rel="icon" href="/favicon.ico" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@300;400;500;600;700;800&family=Orbitron:wght@500;700;800;900&family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>

  <canvas id="starfield-canvas" aria-hidden="true"></canvas>

  <div id="boot-loader" class="boot-loader" aria-live="polite"></div>

  <header id="navbar" class="navbar"></header>

  <main id="main">
    <section id="hero" class="section hero-section visible" data-section-title="Mission Control"></section>
    <section id="iss-tracker" class="section" data-section-title="Live ISS Tracker"></section>
    <section id="earth-from-space" class="section" data-section-title="Live Earth From Space"></section>
    <section id="apod" class="section" data-section-title="APOD + NASA Image Vault"></section>
    <section id="asteroids" class="section" data-section-title="Asteroid & Fireball HQ"></section>
    <section id="mars" class="section" data-section-title="Mars Mission Center"></section>
    <section id="solar-system" class="section" data-section-title="Solar System Command"></section>
    <section id="space-weather" class="section" data-section-title="Sun & Space Weather"></section>
    <section id="exoplanets" class="section" data-section-title="Exoplanet Command"></section>
    <section id="launches" class="section" data-section-title="Launch Tracker"></section>
    <section id="news" class="section" data-section-title="Space News Network"></section>
    <section id="astronauts" class="section" data-section-title="Astronaut Hall"></section>
    <section id="physics" class="section" data-section-title="Physics Simulators"></section>
    <section id="starmap" class="section" data-section-title="Interactive Star Map"></section>
    <section id="satellites" class="section" data-section-title="Satellite Tracker"></section>
    <section id="quiz" class="section" data-section-title="Space Quiz Academy"></section>
    <section id="calendar" class="section" data-section-title="Cosmic Event Calendar"></section>
    <section id="encyclopedia" class="section" data-section-title="Space Encyclopedia"></section>
    <section id="techlab" class="section" data-section-title="Space Technology Lab"></section>
    <section id="distance" class="section" data-section-title="Cosmic Distance Ruler"></section>
    <section id="chat" class="section" data-section-title="Mission Control Chat"></section>
    <section id="settings" class="section" data-section-title="Settings & Control Hub"></section>
  </main>

  <div id="modal-root"></div>
  <div id="toast-root" aria-live="polite"></div>

  <button id="fab" class="fab" type="button" aria-label="Open quick actions">+</button>

  <footer class="footer">
    <div class="footer-brand">
      <strong>COSMOS ULTRA</strong>
      <span>Powered by NASA Open APIs and public space data.</span>
    </div>
    <div class="footer-status">
      <span id="uptime">00:00:00</span>
      <span class="signal-bars">SIGNAL â–‘â–’â–“</span>
    </div>
  </footer>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
